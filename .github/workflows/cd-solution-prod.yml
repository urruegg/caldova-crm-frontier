name: CD — Solution to PROD

on:
  workflow_dispatch:
    inputs:
      test_run_id:
        description: Successful main-branch CD — Solution to TEST run whose exact artifacts are promoted
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: caldova-solution-prod
  cancel-in-progress: false

jobs:
  validate-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate successful TEST source
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RUN_ID: ${{ inputs.test_run_id }}
        run: |
          if ($env:TEST_RUN_ID -notmatch '^[0-9]+$') { throw 'Invalid TEST run ID.' }
          $json = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:TEST_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read TEST workflow run.' }
          $run = $json | ConvertFrom-Json
          if ($run.path -ne '.github/workflows/cd-solution-test.yml' -or
              $run.event -ne 'workflow_dispatch' -or $run.head_branch -ne 'main' -or
              $run.head_repository.full_name -ne $env:GITHUB_REPOSITORY -or
              $run.status -ne 'completed' -or $run.conclusion -ne 'success' -or
              $run.head_sha -notmatch '^[0-9a-f]{40}$') {
            throw 'Only a successful reviewed-main TEST deployment can be promoted.'
          }
          "sha=$($run.head_sha)" >> $env:GITHUB_OUTPUT

  import-to-prod:
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: prod
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      POWER_PLATFORM_ENV_URL: ${{ vars.POWER_PLATFORM_ENV_URL }}
      POWER_PLATFORM_ORG_ID: ${{ vars.POWER_PLATFORM_ORG_ID }}
      SOURCE_SHA: ${{ needs.validate-release.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Download exact tested artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: managed-solutions
          path: ${{ runner.temp }}/promote
          run-id: ${{ inputs.test_run_id }}
          github-token: ${{ github.token }}
      - name: Verify package hashes and reviewed source
        shell: pwsh
        run: |
          . ./infra/scripts/Get-ManagedRelease.ps1
          Get-ManagedRelease -ArtifactPath (Join-Path $env:RUNNER_TEMP 'promote') `
            -ExpectedSha $env:SOURCE_SHA -ForProduction | Out-Null
      - name: Sign in with production workload identity
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Verify production identity before mutation
        shell: pwsh
        run: |
          ./infra/scripts/Test-PlatformConnection.ps1 -Slot prod `
            -TenantId $env:AZURE_TENANT_ID -EnvironmentUrl $env:POWER_PLATFORM_ENV_URL `
            -OrganizationId $env:POWER_PLATFORM_ORG_ID
      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@59c0b2abadc26618ca914c689ab9dc399da4d6bb # v1.9.2
      - name: Import tested managed release
        shell: pwsh
        run: |
          . ./scripts/solution/Resolve-PacCommand.ps1
          . ./infra/scripts/Get-ManagedRelease.ps1
          $pac = Resolve-PacCommand
          & $pac auth create --name promote-prod --githubFederated `
            --applicationId $env:AZURE_CLIENT_ID --tenant $env:AZURE_TENANT_ID `
            --environment $env:POWER_PLATFORM_ENV_URL
          if ($LASTEXITCODE -ne 0) { throw 'PROD authentication failed.' }
          $dir = Join-Path $env:RUNNER_TEMP 'promote'
          $release = Get-ManagedRelease -ArtifactPath $dir -ExpectedSha $env:SOURCE_SHA -ForProduction
          foreach ($solution in $release.solutions) {
            ./scripts/solution/Import-Solution.ps1 -ZipFile (Join-Path $dir $solution.file) -PublishChanges
          }
      - name: Verify deployed managed versions
        shell: pwsh
        run: |
          ./infra/scripts/Test-ManagedDeployment.ps1 -ArtifactPath (Join-Path $env:RUNNER_TEMP 'promote') `
            -ExpectedSha $env:SOURCE_SHA -Slot prod -TenantId $env:AZURE_TENANT_ID `
            -EnvironmentUrl $env:POWER_PLATFORM_ENV_URL -OrganizationId $env:POWER_PLATFORM_ORG_ID
