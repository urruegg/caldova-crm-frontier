name: CD — Infra (Terraform)

# Purpose: validate infra/terraform/ on every PR, and prove OIDC federation to the
# demo tenant works end-to-end on merges to main / manual dispatch.
#
# Guardrails
# - Pull-request runs get NO tenant access. They only validate + fmt-check.
# - Push-to-main and workflow_dispatch runs sign in via OIDC federation to the
#   selected GitHub Environment's Caldova app registration and print
#   the resulting identity — no writes yet. A future PR adds remote state and a
#   real `terraform plan` here.
#
# Auth pattern: see docs/adr/ADR-0002-oidc-federation-for-github-actions-to-entra.md
#               and docs/adr/ADR-0004-ci-plane-app-registrations-and-github-environments.md

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/cd-infra.yml'
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/cd-infra.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment slot to smoke-test OIDC against'
        required: true
        default: 'dev'
        type: choice
        options: [dev, test, prod]

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    permissions:
      contents: read
    # PR-safe: never touches the tenant.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend, no providers)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  smoke_oidc:
    # Push-to-main or manual dispatch: proves the Entra app + federated
    # credential + GitHub Environment variable wiring end-to-end.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    env:
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      POWER_PLATFORM_ENV_URL: ${{ vars.POWER_PLATFORM_ENV_URL }}
      POWER_PLATFORM_ORG_ID: ${{ vars.POWER_PLATFORM_ORG_ID }}
      TARGET_SLOT: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Sign in to Entra via OIDC federation
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Verify configured Dataverse identity
        shell: pwsh
        run: |
          ./infra/scripts/Test-PlatformConnection.ps1 -Slot $env:TARGET_SLOT `
            -TenantId $env:AZURE_TENANT_ID -EnvironmentUrl $env:POWER_PLATFORM_ENV_URL `
            -OrganizationId $env:POWER_PLATFORM_ORG_ID
