name: CD — Solution to TEST

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Import mode
        type: choice
        options: [InstallOrUpdate, StageForUpgrade]
        default: InstallOrUpdate

permissions:
  contents: read
  id-token: write

concurrency:
  group: caldova-solution-test
  cancel-in-progress: false

jobs:
  export-from-dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      POWER_PLATFORM_ENV_URL: ${{ vars.POWER_PLATFORM_ENV_URL }}
      POWER_PLATFORM_ORG_ID: ${{ vars.POWER_PLATFORM_ORG_ID }}
      IMPORT_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Sign in with workload identity
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Verify DEV identity
        shell: pwsh
        run: |
          ./infra/scripts/Test-PlatformConnection.ps1 -Slot dev -TenantId $env:AZURE_TENANT_ID `
            -EnvironmentUrl $env:POWER_PLATFORM_ENV_URL -OrganizationId $env:POWER_PLATFORM_ORG_ID
      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@59c0b2abadc26618ca914c689ab9dc399da4d6bb # v1.9.2
      - name: Install Pester 6.0.1
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.0.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Offline promotion contract tests
        shell: pwsh
        run: |
          $r = Invoke-Pester -Path @(
            './scripts/solution/tests/Get-PromotionComponents.Tests.ps1',
            './scripts/solution/tests/Get-PromotionSmokeResult.Tests.ps1'
          ) -PassThru -Output Detailed
          if ($r.Result -ne 'Passed') { throw 'Offline promotion tests failed.' }
      - name: Authenticate Power Platform CLI (DEV)
        shell: pwsh
        run: |
          . ./scripts/solution/Resolve-PacCommand.ps1
          $pac = Resolve-PacCommand
          & $pac auth create --name promote-dev --githubFederated `
            --applicationId $env:AZURE_CLIENT_ID --tenant $env:AZURE_TENANT_ID `
            --environment $env:POWER_PLATFORM_ENV_URL
          if ($LASTEXITCODE -ne 0) { throw 'PAC federated authentication failed.' }
      - name: Export managed solutions
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'promote'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          ./scripts/solution/Export-Solution.ps1 -SolutionName crmshow_Foundation  -OutFile (Join-Path $out 'crmshow_Foundation_managed.zip')  -Managed
          ./scripts/solution/Export-Solution.ps1 -SolutionName crmshow_DataModel   -OutFile (Join-Path $out 'crmshow_DataModel_managed.zip')   -Managed
          ./scripts/solution/Export-Solution.ps1 -SolutionName crmshow_Integration -OutFile (Join-Path $out 'crmshow_Integration_managed.zip') -Managed
          ./scripts/solution/Export-Solution.ps1 -SolutionName crmshow_Sales       -OutFile (Join-Path $out 'crmshow_Sales_managed.zip')       -Managed
          $solutions = foreach ($name in @('crmshow_Foundation', 'crmshow_DataModel', 'crmshow_Integration', 'crmshow_Sales')) {
            $file = "${name}_managed.zip"
            $path = Join-Path $out $file
            $zip = [IO.Compression.ZipFile]::OpenRead($path)
            try {
              $entry = $zip.GetEntry('solution.xml')
              if (-not $entry) { throw "Missing solution.xml in $file." }
              $reader = [IO.StreamReader]::new($entry.Open())
              try { [xml]$xml = $reader.ReadToEnd() } finally { $reader.Dispose() }
              $manifest = $xml.ImportExportXml.SolutionManifest
              if ($manifest.UniqueName -ne $name -or $manifest.Managed -ne '1') { throw "Invalid managed package $file." }
              @{ name = $name; file = $file; version = [string]$manifest.Version; sha256 = (Get-FileHash $path).Hash }
            } finally { $zip.Dispose() }
          }
          @{ sourceSha = $env:GITHUB_SHA; mode = $env:IMPORT_MODE; solutions = @($solutions) } |
            ConvertTo-Json -Depth 10 | Set-Content (Join-Path $out 'release.json')
      - name: Assert excluded components are absent from the package
        shell: pwsh
        run: |
          . ./scripts/solution/Resolve-PacCommand.ps1
          . ./scripts/solution/Get-PromotionComponents.ps1
          $pac = Resolve-PacCommand
          $out = Join-Path $env:RUNNER_TEMP 'promote'
          $contract = Get-PromotionComponents -SchemaPath ./solution/schema/insurance-foundation.json
          $unpacked = Join-Path $env:RUNNER_TEMP 'unpacked'
          & $pac solution unpack --zipfile (Join-Path $out 'crmshow_DataModel_managed.zip') --folder $unpacked --packagetype Managed --allowDelete
          if ($LASTEXITCODE -ne 0) { throw "pac solution unpack failed (exit $LASTEXITCODE)." }
          $names = (Get-ChildItem -Recurse -File $unpacked | Select-String -SimpleMatch -Pattern $contract.ExcludedComponents)
          if ($names) { throw "Excluded effective-date components present in package: $($names.Pattern -join ', ')" }
          Write-Host 'Package excludes all effective-date components.'
      - name: Upload managed artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: managed-solutions
          path: ${{ runner.temp }}/promote/*
          if-no-files-found: error

  import-to-test:
    runs-on: ubuntu-latest
    needs: export-from-dev
    environment: test
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      POWER_PLATFORM_ENV_URL: ${{ vars.POWER_PLATFORM_ENV_URL }}
      POWER_PLATFORM_ORG_ID: ${{ vars.POWER_PLATFORM_ORG_ID }}
      IMPORT_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Sign in with workload identity
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Verify TEST identity
        shell: pwsh
        run: |
          ./infra/scripts/Test-PlatformConnection.ps1 -Slot test -TenantId $env:AZURE_TENANT_ID `
            -EnvironmentUrl $env:POWER_PLATFORM_ENV_URL -OrganizationId $env:POWER_PLATFORM_ORG_ID
      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@59c0b2abadc26618ca914c689ab9dc399da4d6bb # v1.9.2
      - name: Download managed artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: managed-solutions
          path: ${{ runner.temp }}/promote
      - name: Verify reviewed artifact hashes
        shell: pwsh
        run: |
          . ./infra/scripts/Get-ManagedRelease.ps1
          Get-ManagedRelease -ArtifactPath (Join-Path $env:RUNNER_TEMP 'promote') -ExpectedSha $env:GITHUB_SHA | Out-Null
      - name: Authenticate Power Platform CLI (TEST)
        shell: pwsh
        run: |
          . ./scripts/solution/Resolve-PacCommand.ps1
          $pac = Resolve-PacCommand
          & $pac auth create --name promote-test --githubFederated `
            --applicationId $env:AZURE_CLIENT_ID --tenant $env:AZURE_TENANT_ID `
            --environment $env:POWER_PLATFORM_ENV_URL
          if ($LASTEXITCODE -ne 0) { throw 'PAC federated authentication failed.' }
      - name: Preflight languages
        shell: pwsh
        run: |
          & ./infra/scripts/Set-DataverseLanguages.ps1 -EnvironmentUrl $env:POWER_PLATFORM_ENV_URL -LocaleId 1033,1031,1036,1040
          if ($LASTEXITCODE -ne 0) { throw 'TEST language preflight failed.' }
      - name: Import managed (Foundation, DataModel, Integration, Sales)
        shell: pwsh
        run: |
          # Import order follows solution/manifest.json dependsOn: Foundation <- DataModel/Integration <- Sales.
          $out = Join-Path $env:RUNNER_TEMP 'promote'
          . ./infra/scripts/Get-ManagedRelease.ps1
          $release = Get-ManagedRelease -ArtifactPath $out -ExpectedSha $env:GITHUB_SHA
          foreach ($solution in $release.solutions) {
            ./scripts/solution/Import-Solution.ps1 -ZipFile (Join-Path $out $solution.file) -Mode $env:IMPORT_MODE -PublishChanges
          }
      - name: Smoke evidence
        shell: pwsh
        run: |
          ./infra/scripts/Test-ManagedDeployment.ps1 -ArtifactPath (Join-Path $env:RUNNER_TEMP 'promote') `
            -ExpectedSha $env:GITHUB_SHA -Slot test -TenantId $env:AZURE_TENANT_ID `
            -EnvironmentUrl $env:POWER_PLATFORM_ENV_URL -OrganizationId $env:POWER_PLATFORM_ORG_ID
